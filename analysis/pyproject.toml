[project]
name = "analysis"
version = "0.1.0"
description = "Notebook-based analytics for cdtn-admin (Matomo search statistics)"
readme = "README.md"
authors = [
    { name = "maxgfr", email = "25312957+maxgfr@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "click>=8.4.2",
    "elasticsearch==8.12",
    "httpx>=0.28.1",
    "matplotlib>=3.11.0",
    "networkx>=3.6.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "psycopg[binary]>=3.2.0",
    "pyarrow>=18.0.0",
    "pydantic-settings>=2.14.2",
    "python-louvain>=0.16",
    "requests>=2.32.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.11.0",
    "seaborn>=0.13.2",
    "spacy>=3.8.14",
    "tqdm>=4.67.0",
]

[project.scripts]
ingest-all = "analysis.commands.ingest_all:main"
ingest-simulateurs = "analysis.commands.ingest_simulateurs:main"
ingest-completion-contributions = "analysis.commands.ingest_completion_contributions:main"
ingest-nps-scores = "analysis.commands.ingest_nps_scores:main"

l2 = "analysis.l2.cli:main"

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.0",
    "pytest>=8.0.0",
    "ruff>=0.15.18",
]

[tool.ruff]
target-version = "py313"
line-length = 88
# Notebooks are exploratory research code; lint/format only the package source.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
