# ============================================================================
# cdtn-admin (back-office + pipeline data CDTN) — CI + CD sur GitLab PIC.
#   build   : 5 images via BuildKit DinD mutualisé (ci-common), `parallel: matrix`
#             (frontend, hasura, ingester, alert, export). GitHub reste source de vérité.
#   publish : chart Helm UNIQUE `charts/cdtn-admin` (multi-workloads) en OCI (appVersion = sha
#             commun aux 5 images).
#   deploy  : DÉCLENCHE cdtn-gitops (trigger multi-projet, CI_JOB_TOKEN + allowlist inbound)
#             en passant CHART_NAME=cdtn-admin / CHART_VERSION. Pas de token gitops ici.
# Déploiement : Atlas v2 (zone dev) via ArgoCD synchronisant cdtn-gitops.
# Voir docs/30-migrations/cdtn.md.
#
# ⚠ Build-secret `NPM_TIPTAP_TOKEN` (registre privé @tiptap-pro) REQUIS pour frontend & export
#   (le .npmrc référence ${NPM_TIPTAP_TOKEN} ; install KO sans). Passé via `BUILD_SECRETS` —
#   support ajouté au backend DinD de ci-common. Variable CI/CD `NPM_TIPTAP_TOKEN` (masquée).
# ============================================================================

include:
  - project: socialgouv/commun/studio-tech-commun/sdpsn-devops-ci-utils
    ref: main
    file: ci-common/image-build.yml
  - component: $CI_SERVER_FQDN/socialgouv/commun/studio-tech-commun/components/gitops-cd-component/trigger_app@0.6.0
    inputs:
      job_name: deploy-dev
      stage: deploy
      gitops_project: socialgouv/produits-dnum/citoyens/cdtn/cdtn-gitops
      app_name: cdtn
      deploy_action: dev
      image_target_object: ".cdtn-admin.imageTag"
  - component: $CI_SERVER_FQDN/socialgouv/commun/studio-tech-commun/components/gitops-cd-component/trigger_app@0.6.0
    inputs:
      job_name: deploy-test
      stage: deploy
      gitops_project: socialgouv/produits-dnum/citoyens/cdtn/cdtn-gitops
      app_name: cdtn
      deploy_action: test
      image_target_object: ".cdtn-admin.imageTag"
  - component: $CI_SERVER_FQDN/socialgouv/commun/studio-tech-commun/components/gitops-cd-component/trigger_app@0.6.0
    inputs:
      job_name: deploy-preprod
      stage: deploy
      gitops_project: socialgouv/produits-dnum/citoyens/cdtn/cdtn-gitops
      app_name: cdtn
      deploy_action: preprod
      image_target_object: ".cdtn-admin.imageTag"
  - component: $CI_SERVER_FQDN/socialgouv/commun/studio-tech-commun/components/gitops-cd-component/trigger_app@0.6.0
    inputs:
      job_name: deploy-prod
      stage: deploy
      rules:
        - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      gitops_project: socialgouv/produits-dnum/citoyens/cdtn/cdtn-gitops
      app_name: cdtn
      deploy_action: prod
      image_target_object: ".cdtn-admin.imageTag"

variables:

stages:
  - build
  - deploy
  - release

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

.build-rules: &build-rules
  - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  - if: $CI_COMMIT_BRANCH =~ /^(feat|fix|chore|migration)\//
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# BUILD : 5 images via le backend DinD mutualisé (ci-common). cdtn = produit -> DinD.
# Chaque cible a son Dockerfile/contexte ; frontend & export reçoivent le build-secret tiptap.
# ---------------------------------------------------------------------------
build:
  extends: .build-dind
  interruptible: true
  parallel:
    matrix:
      - COMPONENT: frontend
        BUILD_IMAGE: "$CI_REGISTRY_IMAGE/frontend"
        BUILD_DOCKERFILE: "targets/frontend/Dockerfile"
        BUILD_SECRETS: "NPM_TIPTAP_TOKEN"
      - COMPONENT: hasura
        BUILD_IMAGE: "$CI_REGISTRY_IMAGE/hasura"
        BUILD_CONTEXT: "targets/hasura"
        BUILD_DOCKERFILE: "Dockerfile"
      - COMPONENT: ingester
        BUILD_IMAGE: "$CI_REGISTRY_IMAGE/ingester"
        BUILD_DOCKERFILE: "targets/ingester/Dockerfile"
      - COMPONENT: alert
        BUILD_IMAGE: "$CI_REGISTRY_IMAGE/alert"
        BUILD_DOCKERFILE: "targets/alert-cli/Dockerfile"
      - COMPONENT: export
        BUILD_IMAGE: "$CI_REGISTRY_IMAGE/export"
        BUILD_DOCKERFILE: "targets/export-elasticsearch/Dockerfile"
        BUILD_SECRETS: "NPM_TIPTAP_TOKEN"
      - COMPONENT: analysis
        BUILD_IMAGE: "$CI_REGISTRY_IMAGE/analysis"
        BUILD_CONTEXT: "analysis"
        BUILD_DOCKERFILE: "Dockerfile"
  variables:
    BUILD_CONTEXT: "."
    BUILD_TAGS: "sha-$CI_COMMIT_SHA,$CI_COMMIT_REF_SLUG"
  rules: *build-rules

# PUBLISH : chart Helm UNIQUE (multi-workloads). appVersion = sha = tag commun aux 5 images.

# DEPLOY : déclenche cdtn-gitops (bump de la dépendance `cdtn-admin` du wrapper apps/cdtn-dev).
deploy-dev:
  needs: ["build", "prepare-deploy-dev"]
  environment:
    name: dev

deploy-test:
  needs: ["build", "prepare-deploy-test"]
  environment:
    name: test

deploy-preprod:
  needs: ["build", "prepare-deploy-preprod"]
  environment:
    name: preprod

deploy-prod:
  needs: ["build", "prepare-deploy-prod"]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
  environment:
    name: prod

# RELEASE : même chaîne que .github/workflows/release.yml (lerna), mais via une MR car
# `main` est protégée sur la PIC.
#   1. `release` (manuel sur main) : lerna version calcule la version (conventional commits),
#      bump des package.json + CHANGELOG commité sur release/vX.Y.Z, MR ouverte vers main.
#   2. `publish-release` (auto sur main, au merge de la MR) : si lerna.json porte une version
#      non taguée, lerna publish from-package (npm : @socialgouv/cdtn-types,
#      @socialgouv/cdtn-elasticsearch), puis tag vX.Y.Z + release GitLab.
# Variables CI/CD requises (masquées) :
#   - GITLAB_TOKEN : scopes api + write_repository (pousse release/*, ouvre la MR, crée le tag).
#   - NPM_TOKEN (facultatif) : token npm avec droit de publication sur le scope @socialgouv
#     (le trusted publishing OIDC npm ne supporte pas les GitLab auto-hébergés). Absent : tag
#     et release GitLab créés, libs non publiées.
#   - NPM_TIPTAP_TOKEN : déjà requis pour le build (pnpm install).
.release-job:
  stage: release
  image: node:24.22.1-bookworm
  tags: [socialgouv-linux-small-amd64]
  needs: []
  variables:
    GIT_DEPTH: "0"
    HTTP_PROXY: "http://proxyweb.intranet.social.gouv.fr:8002"
    HTTPS_PROXY: "http://proxyweb.intranet.social.gouv.fr:8002"
    NO_PROXY: "pic.sg.social.gouv.fr,localhost,127.0.0.1"
    http_proxy: "http://proxyweb.intranet.social.gouv.fr:8002"
    https_proxy: "http://proxyweb.intranet.social.gouv.fr:8002"
    no_proxy: "pic.sg.social.gouv.fr,localhost,127.0.0.1"

release:
  extends: .release-job
  script:
    - .gitlab/release-mr.sh
  rules:
    - if: $SCHEDULED_JOB
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

publish-release:
  extends: .release-job
  script:
    - .gitlab/release-publish.sh
  rules:
    - if: $SCHEDULED_JOB
      when: never
    # Seulement quand lerna.json change (merge d'une MR release/*). Job en échec : le relancer
    # depuis son pipeline.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [lerna.json]
