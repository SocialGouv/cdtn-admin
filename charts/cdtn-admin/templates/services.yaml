{{- /* Workloads de type service (Deployment + Service + ConfigMap + Ingress optionnel).
        Le NOM de ressource = clé du composant (www / hasura / export) : les Services
        DOIVENT s'appeler littéralement www/hasura/export (URLs internes en dur :
        http://hasura/v1/graphql, http://export, http://www/api/sitemap). */ -}}
{{- range $name, $comp := .Values.services }}
{{- if $comp.enabled | default true }}
{{- $ctx := dict "name" $name "comp" $comp "root" $ }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "cdtn-admin.labels" $ctx | nindent 4 }}
data:
  {{- range $k, $v := ($comp.configMap.data | default dict) }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "cdtn-admin.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cdtn-admin.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $comp.service.port | default 80 }}
      targetPort: {{ $comp.port }}
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "cdtn-admin.labels" $ctx | nindent 4 }}
  {{- if $.Values.reloader.auto }}
  annotations:
    reloader.stakater.com/auto: "true"
  {{- end }}
spec:
  replicas: {{ $comp.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "cdtn-admin.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cdtn-admin.labels" $ctx | nindent 8 }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "cdtn-admin.image" $ctx | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $comp.port }}
          {{- include "cdtn-admin.envFrom" $ctx | nindent 10 }}
          {{- with $comp.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $comp.probePath }}
          livenessProbe:
            httpGet:
              path: {{ $comp.probePath }}
              port: {{ $comp.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: {{ $comp.probePath }}
              port: {{ $comp.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml $comp.resources | nindent 12 }}
{{- if and $comp.ingress $comp.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "cdtn-admin.labels" $ctx | nindent 4 }}
  {{- with $comp.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $comp.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $comp.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ required "ingress.host requis" $comp.ingress.host | quote }}
      {{- with $comp.ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host requis" $comp.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $comp.service.port | default 80 }}
{{- end }}
{{- end }}
{{- end }}
