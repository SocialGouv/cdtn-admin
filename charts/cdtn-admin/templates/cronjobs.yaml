{{- /* Workloads de type CronJob (ingester, alert) + leur ConfigMap.
        Un Job one-shot pour le seed dev se déclenche en `kubectl create job --from=cronjob/<name>`. */ -}}
{{- range $name, $comp := .Values.cronjobs }}
{{- if $comp.enabled | default true }}
{{- $ctx := dict "name" $name "comp" $comp "root" $ }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "cdtn-admin.labels" $ctx | nindent 4 }}
data:
  {{- range $k, $v := ($comp.configMap.data | default dict) }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  labels:
    {{- include "cdtn-admin.labels" $ctx | nindent 4 }}
spec:
  schedule: {{ $comp.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ $comp.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ $comp.failedJobsHistoryLimit | default 3 }}
  startingDeadlineSeconds: {{ $comp.startingDeadlineSeconds | default 600 }}
  jobTemplate:
    spec:
      backoffLimit: {{ $comp.backoffLimit | default 1 }}
      template:
        metadata:
          labels:
            {{- include "cdtn-admin.labels" $ctx | nindent 12 }}
        spec:
          restartPolicy: Never
          {{- with $.Values.global.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: {{ $name }}
              image: {{ include "cdtn-admin.image" $ctx | quote }}
              imagePullPolicy: {{ $.Values.imagePullPolicy }}
              {{- include "cdtn-admin.envFrom" $ctx | nindent 14 }}
              {{- with $comp.extraEnv }}
              env:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              resources:
                {{- toYaml $comp.resources | nindent 16 }}
{{- end }}
{{- end }}
